<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pix2Tex 概念 A · 纸页编校</title>
  <style>
    :root{--paper:#f3efe5;--sheet:#fffdf7;--ink:#191b1c;--muted:#706d65;--rule:#d6cfc0;--red:#b84432;--blue:#274e83;--shadow:0 30px 80px rgba(61,49,33,.13)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
    body{font-family:"Microsoft YaHei UI",sans-serif;background-image:linear-gradient(rgba(105,93,70,.045) 1px,transparent 1px);background-size:100% 31px}
    button{font:inherit}.app{height:100%;display:grid;grid-template-columns:78px 1fr 382px}
    .tools{background:#1c2021;color:#f5efe3;display:flex;flex-direction:column;align-items:center;padding:22px 0 17px;border-right:1px solid #000;position:relative}
    .mark{width:42px;height:42px;border:1px solid #777064;display:grid;place-items:center;font:28px Georgia,serif;margin-bottom:42px}.tool{width:46px;height:46px;border:0;background:transparent;color:#96968f;border-radius:50%;margin:4px 0;cursor:pointer;font-size:18px;transition:.2s}.tool:hover,.tool.active{color:#fff;background:#303536}.tools .rule{width:28px;height:1px;background:#414647;margin:15px 0}.cpu{margin-top:auto;writing-mode:vertical-rl;font:10px Consolas,monospace;letter-spacing:2px;color:#777d7d}
    .workspace{padding:35px 45px 30px;position:relative;min-width:0}.workspace:before{content:"";position:absolute;left:25px;top:0;bottom:0;width:1px;background:rgba(184,68,50,.38)}
    .top{height:66px;display:flex;align-items:flex-start;justify-content:space-between}.eyebrow{font:700 10px "Segoe UI",sans-serif;letter-spacing:2.2px;color:var(--red);margin-bottom:6px}.title{font:36px/1.05 Georgia,"Times New Roman",serif;letter-spacing:-1.1px}.date{font:11px Consolas,monospace;color:var(--muted);padding-top:8px;text-align:right}.ready{display:inline-block;margin-top:8px;color:#42654e}.ready:before{content:"";display:inline-block;width:6px;height:6px;background:#4d765a;border-radius:50%;margin-right:7px}
    .sheet{height:calc(100% - 78px);background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);display:grid;grid-template-rows:48px 1fr 105px;position:relative;overflow:hidden}
    .sheet:after{content:"03";position:absolute;right:18px;bottom:12px;font:11px Georgia,serif;color:#aaa293}.sheet-head{border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 20px;font:10px Consolas,monospace;color:#69675f;letter-spacing:1px}.sheet-head strong{font-family:"Segoe UI",sans-serif;color:var(--ink);margin-right:auto;letter-spacing:.3px}.confidence{color:var(--blue)}
    .capture{position:relative;margin:24px 28px 18px;border:1px solid #bbb2a2;background:#f2f0e9;display:grid;place-items:center;overflow:hidden}.capture:before{content:"SOURCE IMAGE / 01";position:absolute;top:12px;left:14px;font:9px Consolas,monospace;color:#8d877d;letter-spacing:1.2px}.capture:after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.7);pointer-events:none}.formula-img{width:78%;height:52%;background:#fff;box-shadow:0 8px 26px rgba(50,45,36,.08);display:grid;place-items:center;position:relative}.formula-img math{font-size:34px}.crop{position:absolute;width:84%;height:64%;border:1px solid var(--red)}.crop i{position:absolute;width:9px;height:9px;background:var(--red)}.crop i:nth-child(1){left:-5px;top:-5px}.crop i:nth-child(2){right:-5px;top:-5px}.crop i:nth-child(3){left:-5px;bottom:-5px}.crop i:nth-child(4){right:-5px;bottom:-5px}
    .sheet-actions{border-top:1px solid var(--rule);padding:18px 28px;display:flex;align-items:center;gap:10px}.btn{border:1px solid #bcb5a9;background:transparent;padding:11px 16px;color:var(--ink);cursor:pointer;transition:.18s}.btn:hover{background:#ebe5da}.btn.primary{background:var(--red);border-color:var(--red);color:#fff;margin-left:auto}.hint{font:11px/1.5 Georgia,serif;color:#79746a;margin-left:8px}
    .proof{background:#e7e0d2;border-left:1px solid #c5bcaa;padding:34px 30px 26px;display:grid;grid-template-rows:auto 190px 1fr auto;gap:19px;position:relative}.proof:before{content:"PROOF";position:absolute;right:-5px;top:120px;font:700 74px Georgia,serif;color:rgba(88,73,54,.06);transform:rotate(90deg)}
    .proof h2{font:24px Georgia,serif;margin:0}.proof .sub{font:11px/1.5 sans-serif;color:var(--muted);margin-top:6px}.preview{background:#1e2324;color:#fff;padding:19px;position:relative;display:grid;place-items:center}.preview label{position:absolute;left:14px;top:12px;font:9px Consolas,monospace;color:#8f9898;letter-spacing:1.5px}.preview math{font-size:28px}.ok{position:absolute;right:14px;bottom:12px;color:#8eb39b;font:10px Consolas,monospace}
    .editor{background:var(--sheet);border:1px solid #c9c1b2;padding:17px;display:flex;flex-direction:column;min-height:0}.editor label{font:9px Consolas,monospace;letter-spacing:1.5px;color:var(--red);margin-bottom:12px}.editor textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;font:14px/1.7 "Cascadia Code",Consolas,monospace;color:#262829}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #bbb2a2;padding-top:14px;font:10px Consolas,monospace;color:#6d6a63}.stats strong{display:block;color:#222;font:18px Georgia,serif;margin-top:4px}.copy{margin-top:15px;width:100%;border:0;background:var(--blue);color:white;padding:13px;cursor:pointer;letter-spacing:.5px}.copy:hover{background:#183e70}
    .switcher{position:fixed;z-index:20;left:92px;bottom:16px;background:#fffdf8;border:1px solid #bfb8aa;box-shadow:0 8px 30px rgba(0,0,0,.12);display:flex;padding:4px}.switcher a{font:10px sans-serif;color:#4b4944;text-decoration:none;padding:7px 10px}.switcher a.on{background:#1c2021;color:#fff}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#1c2021;color:white;padding:11px 18px;font-size:12px;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <main class="app">
    <aside class="tools"><div class="mark">∫</div><button class="tool active">⌗</button><button class="tool">⌘</button><div class="rule"></div><button class="tool">◷</button><button class="tool">Aa</button><div class="cpu">CPU · LOCAL · READY</div></aside>
    <section class="workspace">
      <header class="top"><div><div class="eyebrow">PIX2TEX / FORMULA PROOFING</div><div class="title">公式编校台</div></div><div class="date">28 JUL 2026 · 22:48<br><span class="ready">ENGINE READY / 0.45s</span></div></header>
      <article class="sheet">
        <div class="sheet-head"><strong>原始图像</strong>PAGE 12 · FIGURE 04&nbsp;&nbsp;&nbsp;<span class="confidence">CROP LOCKED</span></div>
        <div class="capture"><div class="formula-img"><math display="block"><mrow><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><msup><mi>x</mi><mn>2</mn></msup><mi>d</mi><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow></math><div class="crop"><i></i><i></i><i></i><i></i></div></div></div>
        <div class="sheet-actions"><button class="btn">＋ 打开图片</button><button class="btn">⌘ 粘贴截图</button><span class="hint">拖放论文截图，识别结果只留在本机。</span><button class="btn primary" onclick="toast('已重新识别')">重新识别 →</button></div>
      </article>
    </section>
    <aside class="proof">
      <header><h2>校样结果</h2><div class="sub">先看渲染，再复制代码。像校对论文一样确认它。</div></header>
      <section class="preview"><label>RENDERED PROOF</label><math display="block"><mrow><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><msup><mi>x</mi><mn>2</mn></msup><mi>d</mi><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow></math><span class="ok">✓ VALID</span></section>
      <section class="editor"><label>LATEX / EDITABLE</label><textarea spellcheck="false">\int_{0}^{1} x^2\,dx = \frac{1}{3}</textarea></section>
      <footer><div class="stats"><div>INFERENCE<strong>0.45s</strong></div><div>MODE<strong>CPU</strong></div></div><button class="copy" onclick="toast('LaTeX 已复制')">复制 LaTeX</button></footer>
    </aside>
  </main>
  <nav class="switcher"><a class="on" href="concept-a-paper.html">A 纸页</a><a href="concept-b-instrument.html">B 暗舱</a><a href="concept-c-mica.html">C 雾面</a><a href="index.html">总览</a></nav>
  <div class="toast" id="toast"></div>
  <script>function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}</script>
</body>
</html>
