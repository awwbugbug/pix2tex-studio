<!doctype html>

  <title>Pix2Tex 概念 C · 雾面原生</title>
  <style>
    :root{--ink:#17212a;--muted:#657581;--blue:#2866d7;--blue2:#5e8dea;--glass:rgba(248,251,252,.72);--line:rgba(72,100,116,.16);--shadow:0 30px 80px rgba(44,78,96,.17)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink)}body{font-family:"Segoe UI Variable","Microsoft YaHei UI",sans-serif;background:#dce7eb;position:relative}body:before,body:after{content:"";position:absolute;border-radius:50%;filter:blur(8px)}body:before{width:720px;height:720px;background:radial-gradient(circle,#b6d2da 0,#cfe0e4 48%,transparent 70%);left:-180px;top:-240px}body:after{width:620px;height:620px;background:radial-gradient(circle,#e9c9b8 0,#e7d7cc 45%,transparent 70%);right:-150px;bottom:-250px}
    button{font:inherit}.window{position:absolute;inset:20px 24px;border:1px solid rgba(255,255,255,.8);background:rgba(239,246,247,.64);backdrop-filter:blur(38px) saturate(1.15);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:54px 1fr}.titlebar{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.26)}.appmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--blue),#1e4eaa);display:grid;place-items:center;color:#fff;font:20px Georgia,serif;box-shadow:0 7px 16px rgba(40,102,215,.28)}.appname{font-size:12px;font-weight:650;margin-left:10px}.crumb{font-size:11px;color:var(--muted);margin-left:15px}.winbuttons{margin-left:auto;display:flex;gap:17px;color:#65717a;font-size:12px}.main{display:grid;grid-template-columns:224px 1fr;min-height:0}.sidebar{border-right:1px solid var(--line);padding:22px 13px 16px;background:rgba(244,249,250,.36);display:flex;flex-direction:column}.newcap{height:44px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:650;cursor:pointer;box-shadow:0 9px 20px rgba(40,102,215,.22)}.newcap:hover{background:#1e58c3}.navlabel{font-size:10px;color:#7a8992;letter-spacing:1.2px;margin:25px 10px 8px}.nav{height:40px;border:0;background:transparent;border-radius:10px;color:#61717b;text-align:left;padding:0 12px;cursor:pointer}.nav.active,.nav:hover{background:rgba(255,255,255,.62);color:var(--ink)}.nav span{display:inline-block;width:24px;color:#6e7f89}.privacy{margin-top:auto;padding:13px;border:1px solid rgba(69,113,94,.15);background:rgba(225,241,233,.58);border-radius:13px;color:#4b6759;font-size:10px;line-height:1.5}.privacy b{display:block;font-size:11px;margin-bottom:2px}.privacy b:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#43a16e;margin-right:7px}
    .workspace{padding:27px 31px 24px;display:grid;grid-template-rows:auto 1fr 84px;gap:20px;min-width:0}.heading{display:flex;align-items:center}.heading h1{margin:0;font-size:25px;letter-spacing:-.6px;font-weight:650}.heading p{margin:5px 0 0;color:var(--muted);font-size:11px}.status{margin-left:auto;padding:9px 13px;border-radius:18px;background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.7);font-size:10px;color:#486257}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#47a472;margin-right:7px;box-shadow:0 0 0 4px rgba(71,164,114,.11)}
    .board{display:grid;grid-template-columns:minmax(420px,1.15fr) minmax(350px,.85fr);gap:18px;min-height:0}.glass{background:var(--glass);border:1px solid rgba(255,255,255,.84);box-shadow:0 12px 34px rgba(48,75,87,.08);border-radius:18px}.source-card{padding:15px;display:grid;grid-template-rows:34px 1fr 54px;min-height:0}.cardhead{display:flex;align-items:center;font-size:11px;font-weight:650}.cardhead .tag{margin-left:auto;color:var(--muted);font-size:9px;font-weight:500;background:rgba(224,232,235,.72);padding:5px 8px;border-radius:8px}.image-field{border:1px solid var(--line);border-radius:13px;background:rgba(228,235,236,.62);display:grid;place-items:center;position:relative;overflow:hidden}.paper{width:78%;height:50%;background:white;border-radius:4px;box-shadow:0 14px 36px rgba(34,54,64,.12);display:grid;place-items:center}.paper math{font-size:34px}.selection{position:absolute;width:82%;height:61%;border:2px solid var(--blue);border-radius:6px;box-shadow:0 0 0 999px rgba(34,50,57,.12)}.selection i{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--blue)}.selection i:nth-child(1){left:-6px;top:-6px}.selection i:nth-child(2){right:-6px;top:-6px}.selection i:nth-child(3){left:-6px;bottom:-6px}.selection i:nth-child(4){right:-6px;bottom:-6px}.fileline{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10px}.fileicon{width:28px;height:28px;border-radius:8px;background:#e4ebf7;display:grid;place-items:center;color:var(--blue)}.reselect{margin-left:auto;border:0;background:transparent;color:var(--blue);cursor:pointer;font-size:10px}
    .result-card{padding:18px;display:grid;grid-template-rows:40px 152px 1fr 49px;gap:11px;min-height:0}.badge{margin-left:auto;background:#e1f2e8;color:#347553;border-radius:9px;padding:6px 9px;font-size:9px}.preview{border-radius:13px;background:#16232b;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}.preview:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(70,126,159,.13);filter:blur(2px);right:-40px;top:-70px}.preview math{font-size:27px;z-index:1}.preview small{position:absolute;left:12px;top:11px;color:#82929c;font-size:8px;letter-spacing:1.2px}.editor{border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.48);padding:12px;display:flex;flex-direction:column;min-height:0}.editor label{font-size:9px;color:#71808a;margin-bottom:8px}.editor textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:13px/1.65 "Cascadia Code",Consolas,monospace;color:var(--ink)}.result-actions{display:flex;align-items:center;gap:8px}.latency{font-size:9px;color:var(--muted)}.latency b{display:block;font-size:12px;color:var(--ink)}.ghost,.copy{border:0;border-radius:10px;height:39px;padding:0 14px;cursor:pointer}.ghost{margin-left:auto;background:rgba(224,231,234,.7);color:#53636c}.copy{background:var(--blue);color:#fff;font-weight:650}.copy:hover{background:#1f58bd}
    .command-island{align-self:end;justify-self:center;height:64px;min-width:580px;border-radius:21px;background:rgba(252,254,254,.82);border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 45px rgba(49,75,88,.14);display:flex;align-items:center;padding:0 10px;gap:6px}.cmd{height:44px;border:0;border-radius:12px;background:transparent;padding:0 15px;color:#53636d;cursor:pointer}.cmd:hover{background:#edf2f3;color:var(--ink)}.cmd.primary{background:#18252d;color:#fff;padding:0 21px}.cmd.primary:hover{background:#263741}.divider{width:1px;height:26px;background:#dbe3e5;margin:0 2px}.hotkey{font:9px Consolas,monospace;color:#87949b;margin-left:auto;padding-right:10px}
    .switcher{position:fixed;z-index:20;left:48px;bottom:38px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:12px;display:flex;padding:4px;box-shadow:0 8px 24px rgba(42,68,81,.14)}.switcher a{font:10px sans-serif;color:#687880;text-decoration:none;padding:7px 10px;border-radius:8px}.switcher a.on{background:#18252d;color:#fff}.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;background:#18252d;color:white;border-radius:12px;padding:11px 18px;font-size:11px;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <section class="window">
    <header class="titlebar"><div class="appmark">∫</div><span class="appname">Pix2Tex Studio</span><span class="crumb">/ 识别工作台</span><div class="winbuttons"><span>—</span><span>□</span><span>×</span></div></header>
    <div class="main">
      <aside class="sidebar"><button class="newcap" onclick="toast('准备区域截图')">＋ 新建截图</button><div class="navlabel">工作空间</div><button class="nav active"><span>⌗</span>公式识别</button><button class="nav"><span>◷</span>本地历史</button><button class="nav"><span>⌘</span>剪贴板监听</button><div class="navlabel">应用</div><button class="nav"><span>⚙</span>偏好设置</button><div class="privacy"><b>CPU 引擎已就绪</b>全部识别离线完成<br>不会上传你的论文截图</div></aside>
      <main class="workspace"><header class="heading"><div><h1>晚上好，继续处理公式</h1><p>从截图到 LaTeX，保持流畅，也保留检查的余地。</p></div><div class="status"><i></i>CPU READY · 0.45s</div></header>
        <section class="board"><article class="glass source-card"><div class="cardhead">来源图像<span class="tag">paper-page-12.png</span></div><div class="image-field"><div class="paper"><math><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>π</mi></mrow></msup><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></mrow></math></div><div class="selection"><i></i><i></i><i></i><i></i></div></div><div class="fileline"><span class="fileicon">▧</span><span>1440 × 236 · PNG · 刚刚</span><button class="reselect">重新框选</button></div></article>
          <article class="glass result-card"><div class="cardhead">识别结果<span class="badge">结构有效</span></div><div class="preview"><small>LIVE FORMULA</small><math><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>π</mi></mrow></msup><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></mrow></math></div><div class="editor"><label>LaTeX · 可直接修正</label><textarea spellcheck="false">e^{i\pi} + 1 = 0</textarea></div><footer class="result-actions"><div class="latency">本次耗时<b>0.45 秒</b></div><button class="ghost">换格式</button><button class="copy" onclick="toast('LaTeX 已复制')">复制 LaTeX</button></footer></article></section>
        <nav class="command-island"><button class="cmd primary">⌗ 区域截图</button><button class="cmd">＋ 打开图片</button><button class="cmd">⌘ 粘贴</button><span class="divider"></span><button class="cmd">↻ 重新识别</button><span class="hotkey">ALT + SHIFT + S</span></nav>
      </main>
    </div>
  </section>
