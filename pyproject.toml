[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pix2tex-studio"
version = "2.0.0.dev0"
description = "A local-first Windows desktop formula-to-LaTeX app powered by UniMERNet."
requires-python = ">=3.10,<3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "unimernet==0.2.3",
  "PySide6==6.10.1",
]

[project.scripts]
pix2tex-studio = "pix2tex_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pix2tex_app = ["ui/qml/*.qml", "ui/qml/qmldir", "ui/qml/components/*.qml", "ui/assets/*.js"]
